services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram_ai_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: db_telegram_bot
    ports:
      - '5284:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d db_telegram_bot']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: DockerFile
    container_name: telegram_ai_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:my_password@postgres:5432/db_telegram_bot?schema=public
      WEBHOOK_PORT: 3000
      NODE_ENV: production
      PUBLIC_BASE_URL: https://69c7-202-46-68-1.ngrok-free.app
    ports:
      - '3000:3000'
    command: >
      sh -c "npm run db:push && npm start"

volumes:
  postgres_data:
