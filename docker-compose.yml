services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram_ai_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: db_telegram_bot
    ports:
      - '5284:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d db_telegram_bot']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: telegram_ai_bot_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    command: redis-server --appendonly yes

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_ai_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:my_password@postgres:5432/db_telegram_bot?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 5505
      NODE_ENV: production
      PUBLIC_BASE_URL: https://69c7-202-46-68-1.ngrok-free.app
    ports:
      - '5505:5505'
    command: >
      sh -c "npm run db:push && npm start"

volumes:
  postgres_data:
  redis_data:
